<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo do Gestão de Culto</title>
  <desc id="desc">Fluxo completo do sistema: planejamento, escalas, execução do culto e acompanhamento.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf3f7"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#182b49"/>
      <stop offset="1" stop-color="#214f67"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#18324a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#668399"/>
    </marker>
    <marker id="arrowLight" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8fc8c2"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-size: 21px; fill: #d9e7ee; }
      .phase { font-size: 17px; font-weight: 700; letter-spacing: 1.5px; }
      .card-title { font-size: 23px; font-weight: 700; fill: #182b49; }
      .card-copy { font-size: 17px; fill: #526b7c; }
      .number { font-size: 21px; font-weight: 700; fill: #ffffff; }
      .footer { font-size: 22px; font-weight: 700; fill: #18324a; }
      .footer-copy { font-size: 17px; fill: #526b7c; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect x="0" y="0" width="1600" height="205" fill="url(#header)"/>
  <circle cx="1450" cy="-50" r="250" fill="#ffffff" opacity="0.05"/>
  <circle cx="1550" cy="110" r="170" fill="#8fc8c2" opacity="0.08"/>

  <g class="font">
    <text x="100" y="83" class="title">Gestão de Culto</text>
    <text x="100" y="128" class="subtitle">Do planejamento ao acompanhamento: um único fluxo para toda a equipe.</text>
    <rect x="100" y="158" width="235" height="8" rx="4" fill="#8fc8c2"/>

    <!-- Phase labels -->
    <text x="100" y="267" class="phase" fill="#2f72a1">01  PLANEJAMENTO</text>
    <text x="490" y="267" class="phase" fill="#8a6417">02  ESCALAS</text>
    <text x="880" y="267" class="phase" fill="#2d776e">03  EXECUÇÃO</text>
    <text x="1270" y="267" class="phase" fill="#704c91">04  ACOMPANHAMENTO</text>

    <!-- Connectors -->
    <line x1="440" y1="470" x2="478" y2="470" stroke="#668399" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="830" y1="470" x2="868" y2="470" stroke="#668399" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1220" y1="470" x2="1258" y2="470" stroke="#668399" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Cards -->
    <g filter="url(#shadow)">
      <rect x="100" y="300" width="340" height="340" rx="20" fill="#ffffff"/>
      <rect x="100" y="300" width="340" height="10" rx="5" fill="#3b82b7"/>
      <circle cx="145" cy="360" r="24" fill="#3b82b7"/>
      <text x="145" y="368" text-anchor="middle" class="number">1</text>
      <text x="180" y="368" class="card-title">Preparar o culto</text>
      <text x="135" y="430" class="card-copy">• Cadastrar ministérios</text>
      <text x="135" y="467" class="card-copy">• Cadastrar voluntários</text>
      <text x="135" y="504" class="card-copy">• Criar ou duplicar o culto</text>
      <text x="135" y="541" class="card-copy">• Usar templates para ganhar tempo</text>
      <rect x="135" y="575" width="270" height="35" rx="17" fill="#eaf3f9"/>
      <text x="270" y="598" text-anchor="middle" font-size="15" font-weight="700" fill="#2f72a1">BASE ORGANIZADA</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="490" y="300" width="340" height="340" rx="20" fill="#ffffff"/>
      <rect x="490" y="300" width="340" height="10" rx="5" fill="#d09b2e"/>
      <circle cx="535" cy="360" r="24" fill="#d09b2e"/>
      <text x="535" y="368" text-anchor="middle" class="number">2</text>
      <text x="570" y="368" class="card-title">Organizar equipes</text>
      <text x="525" y="430" class="card-copy">• Montar o cronograma</text>
      <text x="525" y="467" class="card-copy">• Definir responsáveis por etapa</text>
      <text x="525" y="504" class="card-copy">• Criar escalas por função</text>
      <text x="525" y="541" class="card-copy">• Confirmar presença</text>
      <rect x="525" y="575" width="270" height="35" rx="17" fill="#fbf4e5"/>
      <text x="660" y="598" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6417">CADA UM SABE SEU PAPEL</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="880" y="300" width="340" height="340" rx="20" fill="#ffffff"/>
      <rect x="880" y="300" width="340" height="10" rx="5" fill="#3d988d"/>
      <circle cx="925" cy="360" r="24" fill="#3d988d"/>
      <text x="925" y="368" text-anchor="middle" class="number">3</text>
      <text x="960" y="368" class="card-title">Executar o culto</text>
      <text x="915" y="430" class="card-copy">• Consultar o dashboard</text>
      <text x="915" y="467" class="card-copy">• Acompanhar o cronograma</text>
      <text x="915" y="504" class="card-copy">• Identificar pendências e atrasos</text>
      <text x="915" y="541" class="card-copy">• Usar a escala como referência</text>
      <rect x="915" y="575" width="270" height="35" rx="17" fill="#e8f5f2"/>
      <text x="1050" y="598" text-anchor="middle" font-size="15" font-weight="700" fill="#2d776e">VISÃO EM TEMPO REAL</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1270" y="300" width="230" height="340" rx="20" fill="#ffffff"/>
      <rect x="1270" y="300" width="230" height="10" rx="5" fill="#815ca3"/>
      <circle cx="1315" cy="360" r="24" fill="#815ca3"/>
      <text x="1315" y="368" text-anchor="middle" class="number">4</text>
      <text x="1350" y="368" class="card-title">Acompanhar</text>
      <text x="1305" y="430" class="card-copy">• Registrar convidados</text>
      <text x="1305" y="467" class="card-copy">• Acompanhar convertidos</text>
      <text x="1305" y="504" class="card-copy">• Consultar relatórios</text>
      <text x="1305" y="541" class="card-copy">• Melhorar o próximo culto</text>
      <rect x="1305" y="575" width="160" height="35" rx="17" fill="#f1ebf6"/>
      <text x="1385" y="598" text-anchor="middle" font-size="15" font-weight="700" fill="#704c91">HISTÓRICO E CUIDADO</text>
    </g>

    <!-- Bottom message and loop -->
    <path d="M1385 665 C1385 760, 270 760, 270 665" fill="none" stroke="#8fc8c2" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrowLight)"/>
    <rect x="455" y="715" width="690" height="104" rx="52" fill="#ffffff" stroke="#c6d9dc" stroke-width="2" filter="url(#shadow)"/>
    <text x="800" y="760" text-anchor="middle" class="footer">Preparar • Escalar • Executar • Acompanhar</text>
    <text x="800" y="790" text-anchor="middle" class="footer-copy">Um fluxo contínuo para servir melhor e reduzir retrabalho.</text>
  </g>
</svg>
