<div class="page-header">
  <div>
    <h2>Cultos</h2>
    <p>Cadastre e organize cada culto com poucos campos.</p>
  </div>
  <button nbButton status="primary" type="button" (click)="abrirModalNovoCulto()">Novo culto</button>
</div>

<div class="feedback sucesso" *ngIf="mensagemSucesso">{{ mensagemSucesso }}</div>
<div class="feedback erro" *ngIf="mensagemErro">{{ mensagemErro }}</div>

<nb-card>
  <nb-card-header class="grid-header">
    <span>Cultos cadastrados</span>
    <div class="grid-search">
      <input nbInput fullWidth type="search" placeholder="Buscar culto..." [(ngModel)]="filtroGrid" [ngModelOptions]="{ standalone: true }" />
      <button nbButton size="small" status="basic" type="button" *ngIf="filtroGrid" (click)="filtroGrid = ''">Limpar</button>
    </div>
  </nb-card-header>
  <nb-card-body>
    <ag-grid-angular
      class="ag-theme-alpine cultos-grid"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [pagination]="true"
      [paginationPageSize]="paginationPageSize"
      [localeText]="localeText"
      [quickFilterText]="filtroGrid"
      (cellClicked)="onGridCellClicked($event)"
    ></ag-grid-angular>
  </nb-card-body>
</nb-card>

<div class="modal-backdrop" *ngIf="modalAberto" (click)="cancelarEdicao()"></div>
<div class="modal-wrapper" *ngIf="modalAberto">
  <nb-card class="modal-card">
    <nb-card-header>{{ cultoEditandoId ? 'Editar culto' : 'Novo culto' }}</nb-card-header>
    <nb-card-body>
      <form class="form-grid" [formGroup]="form" (ngSubmit)="salvar()">
        <div class="form-field">
          <label for="culto-nome">Nome do culto</label>
          <input id="culto-nome" nbInput fullWidth formControlName="nome" placeholder="Ex.: Culto de Celebração" />
        </div>
        <div class="form-field">
          <label for="culto-tipo">Tipo do culto</label>
          <input id="culto-tipo" nbInput fullWidth formControlName="tipoCulto" placeholder="Ex.: Domingo" />
        </div>
        <div class="form-field">
          <label for="culto-data">Data</label>
          <input id="culto-data" nbInput fullWidth type="date" formControlName="dataCulto" />
        </div>
        <div class="form-field">
          <label for="culto-horario">Horário de início</label>
          <input id="culto-horario" nbInput fullWidth type="time" formControlName="horarioInicio" />
        </div>
        <div class="form-field">
          <label for="culto-status">Status do culto</label>
          <nb-select id="culto-status" formControlName="statusCultoId" placeholder="Selecione o status">
            <nb-option *ngFor="let status of statusOptions" [value]="status.id">{{ status.label }}</nb-option>
          </nb-select>
        </div>
        <div class="form-field">
          <label for="culto-observacoes">Observações</label>
          <input id="culto-observacoes" nbInput fullWidth formControlName="observacoesGerais" placeholder="Observações gerais (opcional)" />
        </div>
        <div class="actions">
          <button nbButton status="primary" [disabled]="carregando" type="submit">
            {{ cultoEditandoId ? 'Atualizar culto' : 'Salvar culto' }}
          </button>
          <button nbButton status="basic" type="button" [disabled]="carregando" (click)="cancelarEdicao()">
            Fechar
          </button>
        </div>
      </form>
    </nb-card-body>
  </nb-card>
</div>
