<div class="page-header">
  <div>
    <h2>Voluntários</h2>
    <p>Cadastre pessoas para escala e operação dos cultos.</p>
  </div>
  <button nbButton status="primary" type="button" (click)="abrirModalNovo()">Novo voluntário</button>
</div>

<nb-card>
  <nb-card-header class="grid-header">
    <span>Voluntários cadastrados</span>
    <div class="grid-search">
      <input nbInput fullWidth type="search" placeholder="Buscar voluntário..." [(ngModel)]="filtroGrid" [ngModelOptions]="{ standalone: true }" />
      <button nbButton size="small" status="basic" type="button" *ngIf="filtroGrid" (click)="filtroGrid = ''">Limpar</button>
    </div>
  </nb-card-header>
  <nb-card-body>
    <ag-grid-angular
      class="ag-theme-alpine voluntarios-grid"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [pagination]="true"
      [paginationPageSize]="paginationPageSize"
      [localeText]="localeText"
      [quickFilterText]="filtroGrid"
      (cellClicked)="onGridCellClicked($event)"
    ></ag-grid-angular>
  </nb-card-body>
</nb-card>

<div class="modal-backdrop" *ngIf="modalAberto" (click)="cancelarEdicao()"></div>
<div class="modal-wrapper" *ngIf="modalAberto">
  <nb-card class="modal-card">
    <nb-card-header>{{ voluntarioEditandoId ? 'Editar voluntário' : 'Novo voluntário' }}</nb-card-header>
    <nb-card-body>
      <form class="form-grid" [formGroup]="form" (ngSubmit)="salvar()">
        <div class="form-field">
          <label for="vol-nome">Nome completo</label>
          <input id="vol-nome" nbInput fullWidth formControlName="nome" placeholder="Nome completo" />
        </div>
        <div class="form-field">
          <label for="vol-usuario">Usuário de acesso (opcional)</label>
          <nb-select id="vol-usuario" fullWidth formControlName="usuarioId" placeholder="Selecione um usuário">
            <nb-option [value]="null">Sem vínculo</nb-option>
            <nb-option *ngFor="let usuario of usuariosDisponiveis()" [value]="usuario.id">
              {{ usuario.nome }} ({{ usuario.email }})
            </nb-option>
          </nb-select>
        </div>
        <div class="form-field">
          <label for="vol-telefone">Telefone</label>
          <input id="vol-telefone" nbInput fullWidth formControlName="telefone" placeholder="Telefone (opcional)" />
        </div>
        <div class="form-field">
          <label for="vol-email">E-mail</label>
          <input id="vol-email" nbInput fullWidth formControlName="email" placeholder="E-mail (opcional)" />
        </div>
        <div class="form-field">
          <label for="vol-ministerios">Ministérios de atuação</label>
          <nb-select id="vol-ministerios" fullWidth multiple formControlName="ministerioIds" placeholder="Selecione os ministérios">
            <nb-option *ngFor="let ministerio of ministerios" [value]="ministerio.id">{{ ministerio.nome }}</nb-option>
          </nb-select>
        </div>
        <div class="form-field">
          <label for="vol-observacoes">Observações</label>
          <input id="vol-observacoes" nbInput fullWidth formControlName="observacoes" placeholder="Observações (opcional)" />
        </div>
        <div class="form-field">
          <label for="vol-restricoes">Restrições de disponibilidade</label>
          <input id="vol-restricoes" nbInput fullWidth formControlName="restricoesIndisponibilidade" placeholder="Ex.: Não pode aos sábados" />
        </div>
        <nb-checkbox formControlName="ativo">Voluntário ativo</nb-checkbox>
        <div class="actions">
          <button nbButton status="primary" [disabled]="carregando">
            {{ voluntarioEditandoId ? 'Atualizar voluntário' : 'Salvar voluntário' }}
          </button>
          <button nbButton status="basic" type="button" (click)="cancelarEdicao()">Fechar</button>
        </div>
      </form>
    </nb-card-body>
  </nb-card>
</div>
