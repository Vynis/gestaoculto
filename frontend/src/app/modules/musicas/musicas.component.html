<div class="page-header">
  <div>
    <h2>Músicas</h2>
    <p>Biblioteca do louvor com filtros e cadastro rápido.</p>
  </div>
  <button nbButton status="primary" type="button" (click)="abrirModalNova()">Nova música</button>
</div>

<nb-card>
  <nb-card-header class="grid-header">
    <span>Lista de músicas</span>
    <div class="grid-search">
      <input nbInput fullWidth type="search" placeholder="Buscar música..." [(ngModel)]="filtroGrid" [ngModelOptions]="{ standalone: true }" />
      <button nbButton size="small" status="basic" type="button" *ngIf="filtroGrid" (click)="filtroGrid = ''">Limpar</button>
    </div>
  </nb-card-header>
  <nb-card-body>
    <div class="toolbar">
      <nb-select [(ngModel)]="filtroAtivo" placeholder="Status" [ngModelOptions]="{ standalone: true }">
        <nb-option value="">Todos</nb-option>
        <nb-option value="true">Ativas</nb-option>
        <nb-option value="false">Inativas</nb-option>
      </nb-select>
      <button nbButton status="info" type="button" (click)="carregar()">Filtrar</button>
    </div>

    <ag-grid-angular
      class="ag-theme-alpine musicas-grid"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [pagination]="true"
      [paginationPageSize]="paginationPageSize"
      [localeText]="localeText"
      [quickFilterText]="filtroGrid"
      (cellClicked)="onGridCellClicked($event)"
    ></ag-grid-angular>
  </nb-card-body>
</nb-card>

<div class="modal-backdrop" *ngIf="modalAberto" (click)="fecharModal()"></div>
<div class="modal-wrapper" *ngIf="modalAberto">
  <nb-card class="modal-card">
    <nb-card-header>{{ musicaEditandoId ? 'Editar música' : 'Nova música' }}</nb-card-header>
    <nb-card-body>
      <form class="form-grid" [formGroup]="form" (ngSubmit)="salvar()">
        <div class="form-field">
          <label for="musica-titulo">Título</label>
          <input id="musica-titulo" nbInput formControlName="titulo" placeholder="Título da música" />
        </div>
        <div class="form-field">
          <label for="musica-artista">Artista/Banda</label>
          <input id="musica-artista" nbInput formControlName="artistaBanda" placeholder="Artista ou banda" />
        </div>
        <div class="form-field">
          <label for="musica-tom">Tom</label>
          <input id="musica-tom" nbInput formControlName="tom" placeholder="Ex.: D, Gm" />
        </div>
        <div class="form-field">
          <label for="musica-cifra">Link da cifra</label>
          <input id="musica-cifra" nbInput formControlName="linkCifra" placeholder="URL da cifra (opcional)" />
          <div class="link-acoes" *ngIf="form.controls.linkCifra.value">
            <app-external-link-viewer [url]="form.controls.linkCifra.value" label="Cifra" mode="modal"></app-external-link-viewer>
          </div>
        </div>
        <div class="form-field">
          <label for="musica-video">Link de vídeo</label>
          <input id="musica-video" nbInput formControlName="linkVideo" placeholder="URL de referência (opcional)" />
          <div class="link-acoes" *ngIf="form.controls.linkVideo.value">
            <app-external-link-viewer [url]="form.controls.linkVideo.value" label="Vídeo" mode="blank"></app-external-link-viewer>
          </div>
        </div>
        <div class="form-field">
          <label for="musica-obs">Observações</label>
          <input id="musica-obs" nbInput formControlName="observacoes" placeholder="Observações (opcional)" />
        </div>
        <nb-checkbox formControlName="ativo">Música ativa</nb-checkbox>
        <div class="actions">
          <button nbButton status="primary">{{ musicaEditandoId ? 'Atualizar' : 'Salvar' }}</button>
          <button nbButton status="basic" type="button" (click)="fecharModal()">Fechar</button>
        </div>
      </form>
    </nb-card-body>
  </nb-card>
</div>
